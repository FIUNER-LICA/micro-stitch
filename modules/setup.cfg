[radon]
exclude = tests,*__init__.py
cc_min = B
average = True
total_average = True
ignore = tests,__init__.py
output_file = halstead.json


[flake8]
extend-ignore = E2, E1, E3, E4, E5, E7, W2,W3,F4,F8,N8
exclude =
    .git,
    __pycache__,
max-line-length = 80
max-complexity = 10
statistics = true
count = true
exit-zero = false
output-file = flake8-report.json
format = json-pretty
tee = true
jobs = auto